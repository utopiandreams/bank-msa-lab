spring:
  application:
    name: bank-mock
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  # actuator는 별도 포트로 분리한다. 같은 포트(8080)면 gateway Ingress를 통해 /actuator/prometheus가 인터넷에 열린다
  # (지표에는 경로·에러율·버전·내부 구조가 다 보인다). 8081은 Service·Ingress에 없고 Prometheus만 파드로 직접 긁는다.
  # 포트 값은 공통 차트가 MANAGEMENT_SERVER_PORT로 덮어쓴다 (deploy/helm/spring-service, 차트가 기준)
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # 프로브는 관리 포트가 아니라 앱 포트(8080)의 /livez·/readyz로 받는다. 관리 포트로 받으면
        # 앱 포트(Tomcat·Netty)가 고장 나 요청을 못 받는데도 Ready로 보여 트래픽이 계속 들어온다
        add-additional-paths: true
  metrics:
    tags:
      application: ${spring.application.name}   # 모든 지표에 서비스 이름 라벨 (JVM 대시보드가 이 라벨로 고른다)
    distribution:
      # API 지연 히스토그램(버킷)을 내보낸다. 이게 있어야 Prometheus에서 p99를 계산할 수 있다 (histogram_quantile).
      # 앱 안에서 백분위를 미리 계산하는 방식(percentiles)은 파드 여러 개를 합칠 수 없어서 쓰지 않는다
      percentiles-histogram:
        http.server.requests: true
        # 아래는 서비스 RED 대시보드(deploy/grafana/dashboards/bank-red.json)의 p99용. 이 서비스에 없는 지표는 그냥 무시된다
        http.client.requests: true           # 다른 서비스 호출 (transfer → core · bank-mock)
        spring.cloud.gateway.requests: true  # gateway 라우트별 (gateway의 서버 지표는 라우팅된 요청을 uri=UNKNOWN으로 뭉친다)
        spring.kafka.listener: true          # Kafka 소비 (메시지 하나 처리 시간)
        spring.kafka.template: true          # Kafka 발행 (Outbox 릴레이)
        tasks.scheduled.execution: true      # @Scheduled (릴레이 · 결과 불명 해소)

# 외부 은행의 행동 (BankMockProperties). 클러스터에서는 환경변수 BANK_MOCK_REJECT_RATE_PERCENT 등으로 바꾼다
bank-mock:
  reject-account-prefix: "999"   # 받는 계좌가 이걸로 시작하면 "계좌 없음" 거절
  reject-rate-percent: 0         # 그 밖의 요청을 이 확률로 거절 (실험 스위치)
  processing-delay: 0s           # 받은 뒤 판정까지 지연 (실험 스위치). 처리 상한을 넘으면 처리하지 않음 → 조회하면 "없음"
  response-delay: 0s             # 판정·기록 뒤 응답 지연 (실험 스위치). transfer read-timeout(3s)보다 길면 "처리했는데 응답 못 받음"
  processing-deadline: 10s       # 처리 상한 = 외부와의 계약. transfer.resolution.external-check-after는 이 값 + 여유
  lookup-lies-not-found: false   # 실험 스위치: 조회 계약 위반 (처리했는데 조회엔 "없음", 정산 파일엔 나옴) → 이중 지급 재현용

server:
  shutdown: graceful
  tomcat:
    # Tomcat 스레드 지표(tomcat.threads.busy·current·config.max)를 내보내려면 MBean 등록이 필요하다 (Boot 기본값 꺼짐).
    # 부하를 올릴 때 "바쁜 스레드가 최대치에 붙었나" = 요청이 앱에 들어오기 전에 줄 서기 시작했나를 보는 숫자
    mbeanregistry:
      enabled: true
    threads:
      max: 200   # 기본값과 같지만 명시 (pitfalls 13 보이지 않는 기본값). 이 선에 붙으면 대기열이 생긴다

logging:
  pattern:
    # 로그 줄마다 trace_id·span_id (2026-11-25, 10주 차). 값은 OTel 에이전트가 요청마다 MDC에 넣어 준다 (앱 코드 변경 없음).
    # Boot 기본 패턴의 "상관관계" 자리에 들어간다. 노드의 Alloy가 trace_id를 꺼내 Loki 구조화 메타데이터로 → Grafana에서 로그 ↔ 트레이스 클릭 이동
    # 요청 밖(스케줄러 회차 등)에서 찍힌 줄은 값이 비어 [trace_id= span_id=]로 나온다
    correlation: "[trace_id=%X{trace_id:-} span_id=%X{span_id:-}] "
