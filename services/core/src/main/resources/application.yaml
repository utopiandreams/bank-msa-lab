spring:
  application:
    name: core
  jpa:
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만
    open-in-view: false       # 트랜잭션이 끝난 뒤(컨트롤러·뷰)에 지연 로딩으로 DB를 다시 치지 않게
  # 접속 정보(spring.datasource.*)는 여기 쓰지 않는다
  #   클러스터: CloudNativePG Secret → 환경변수 (deploy/apps/core/values.yaml)
  #   테스트:   Testcontainers @ServiceConnection (TestcontainersConfiguration)
  lifecycle:
    timeout-per-shutdown-phase: 30s   # preStop 5초 + 30초 < terminationGracePeriodSeconds 45초 (deploy/helm/spring-service)

# 쿠버네티스(프로브)·Prometheus(지표)가 기대는 설정. 기본값과 같은 것도 버전업으로 바뀌지 않게 명시한다
management:
  # actuator는 별도 포트로 분리한다. 같은 포트(8080)면 gateway Ingress를 통해 /actuator/prometheus가 인터넷에 열린다
  # (지표에는 경로·에러율·버전·내부 구조가 다 보인다). 8081은 Service·Ingress에 없고 Prometheus만 파드로 직접 긁는다.
  # 포트 값은 공통 차트가 MANAGEMENT_SERVER_PORT로 덮어쓴다 (deploy/helm/spring-service, 차트가 기준)
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, experiments   # experiments: 실험 스위치 (core.experiment.ExperimentsEndpoint)
  endpoint:
    health:
      probes:
        enabled: true
        # 프로브는 관리 포트가 아니라 앱 포트(8080)의 /livez·/readyz로 받는다. 관리 포트로 받으면
        # 앱 포트(Tomcat·Netty)가 고장 나 요청을 못 받는데도 Ready로 보여 트래픽이 계속 들어온다
        add-additional-paths: true
  metrics:
    tags:
      application: ${spring.application.name}   # 모든 지표에 서비스 이름 라벨 (JVM 대시보드가 이 라벨로 고른다)
    distribution:
      # API 지연 히스토그램(버킷)을 내보낸다. 이게 있어야 Prometheus에서 p99를 계산할 수 있다 (histogram_quantile).
      # 앱 안에서 백분위를 미리 계산하는 방식(percentiles)은 파드 여러 개를 합칠 수 없어서 쓰지 않는다
      percentiles-histogram:
        http.server.requests: true

server:
  shutdown: graceful
  tomcat:
    # Tomcat 스레드 지표(tomcat.threads.busy·current·config.max)를 내보내려면 MBean 등록이 필요하다 (Boot 기본값 꺼짐).
    # 부하를 올릴 때 "바쁜 스레드가 최대치에 붙었나" = 요청이 앱에 들어오기 전에 줄 서기 시작했나를 보는 숫자
    mbeanregistry:
      enabled: true
    threads:
      max: 200   # 기본값과 같지만 명시 (pitfalls 13 보이지 않는 기본값). 이 선에 붙으면 대기열이 생긴다

# 락 전략 (7주 차 실험 스위치, account/application/balance/LockProperties). 파드가 뜰 때의 기본값
# 실행 중 변경: POST :8081/actuator/experiments {"lockStrategy": "..."} (재시작하면 여기 값으로 돌아온다)
core:
  lock:
    # 기본값 ATOMIC_UPDATE (2026-11-23 개발자 결정, docs/experiments/week-07-locks.md): 지금 규칙(잔액 ≥ 금액, 소유자)은 전부 행 하나 안의 조건.
    # 핫 계좌 500건/초에서도 p99 7ms·실패 0. 행 밖 정보가 필요한 규칙(일일 이체 한도 등)이 생기면 그 작업만 비관적 락으로
    strategy: ATOMIC_UPDATE       # NONE | OPTIMISTIC | PESSIMISTIC | ATOMIC_UPDATE | REDIS | REDIS_SPIN
    optimistic-max-attempts: 3    # 낙관적 락 충돌 시 트랜잭션 시도 횟수 (첫 시도 포함)
    redis:                        # REDIS·REDIS_SPIN 전략의 분산 락 (account/infrastructure/lock/RedisAccountLocks)
      wait-time: 1s               # 못 잡으면 포기 → 503. transfer → core read-timeout(3초)보다 짧게
      lease-time: 10s             # 잡은 뒤 자동 해제 (워치독 끔). 처리가 더 길면 @Version 안전망
  # REDIS 전략의 분산 락 저장소 (account/infrastructure/lock/RedissonConfig). 클러스터는 CORE_REDIS_ADDRESS로 덮어쓴다 (deploy/apps/core)
  # 처음 명령을 보낼 때 붙으므로(lazy) Redis가 없어도 앱은 뜬다
  redis:
    address: redis://localhost:6379
    connect-timeout-ms: 1000      # 외부 호출 타임아웃 (Redisson 기본 10초는 송금 API에 너무 길다)
    timeout-ms: 1000              # 명령 응답 대기 (기본 3초)
