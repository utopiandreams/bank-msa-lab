spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # 라우팅 표: "이 경로로 오면 저 서비스로". 경로는 바꾸지 않고 그대로 넘긴다 (/transfers/abc → transfer의 /transfers/abc)
          routes:
            - id: transfer
              uri: ${TRANSFER_BASE_URL:http://transfer}   # 클러스터 내부 DNS: Service "transfer"(포트 80)
              predicates:
                - Path=/transfers/**                      # /transfers 자체도 매칭된다 (**는 0개 이상의 경로 조각)
            # 계좌 개설·조회만 core로 (G-4). core는 X-User-Id로 예금주를 정하고, 조회는 주인만 허용한다
            - id: core-accounts
              uri: ${CORE_BASE_URL:http://core}
              predicates:
                - Path=/accounts/**
            # core의 /postings(입출금·송금 처리)는 일부러 라우팅하지 않는다: 고객의 송금 입구는 transfer 하나 (ADR-0002 결정 4)
          # 다운스트림 호출 타임아웃 (CLAUDE.md 7장: 외부 호출에는 반드시 타임아웃)
          httpclient:
            connect-timeout: 1000   # ms. 클러스터 내부라 1초 넘으면 대상이 없거나 네트워크 문제
            # transfer는 core를 최대 3초(read-timeout) 기다린다. 그보다 짧으면 transfer가 아직 처리 중인데
            # gateway가 먼저 504를 내서, 고객은 실패로 알고 재시도한다 → 바깥 타임아웃 > 안쪽 타임아웃
            response-timeout: 5s
  lifecycle:
    timeout-per-shutdown-phase: 30s   # preStop 5초 + 30초 < terminationGracePeriodSeconds 45초 (deploy/helm/spring-service)

# 토큰 (ADR-0002, security/JwtProperties)
gateway:
  jwt:
    secret: ${GATEWAY_JWT_SECRET}   # 기본값 없음: 비밀키가 없으면 기동 실패 (k8s Secret gateway-jwt → 환경변수)
    issuer: bank-gateway            # 발급할 때 iss에 넣고, 검증할 때 iss가 이 값인지 확인
    ttl: 15m                        # 액세스 토큰 수명. 리프레시가 없으니 만료되면 /auth/token을 다시 부른다

# 쿠버네티스가 기대는 설정. 기본값과 같지만 버전업으로 바뀌지 않게 명시한다
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
