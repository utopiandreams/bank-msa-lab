spring:
  application:
    name: notification
  jpa:
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway만 만든다
    open-in-view: false
  flyway:
    # transfer와 같은 이유: 계정 이름 = 스키마 이름(notification)이면 search_path("$user", public) 때문에
    # 두 번째 기동부터 기록 테이블을 못 찾는다 (2026-11-14 transfer CrashLoopBackOff). 기록 테이블 위치를 public으로 고정
    default-schema: public
  # 접속 정보(spring.datasource.*)는 여기 쓰지 않는다: 클러스터는 CloudNativePG Secret → 환경변수, 테스트는 @ServiceConnection
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:bank-kafka-kafka-bootstrap:9092}
    consumer:
      group-id: notification   # 같은 그룹의 컨슈머(파드)끼리 파티션을 나눠 맡는다. 파드를 늘려도 알림은 한 번
      # 처음 붙는 그룹은 토픽의 처음부터 읽는다 (최신부터면 notification이 배포되기 전 송금은 알림이 영영 안 간다).
      # 처음부터 다시 읽어도 event_id 멱등이라 중복 알림은 없다
      auto-offset-reset: earliest
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
