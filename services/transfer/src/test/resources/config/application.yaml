# 테스트 전용 설정 덧씌우기. classpath:/config/application.yaml은 classpath:/application.yaml(main) 위에 **합쳐서** 올라간다
# (같은 이름으로 src/test/resources/application.yaml을 만들면 main 설정을 통째로 가려 버린다)
#
# 해소 스케줄러를 끈다: 테스트가 일부러 만든 "보낸 지 10초 지난" 송금을 스케줄러가 테스트 도중에 먼저 확정해 버리면
# 결과가 타이밍에 따라 달라진다 (가짜 core 응답도 그 순간 값). 해소 테스트는 유스케이스를 직접 부른다.
transfer:
  resolution:
    enabled: false
