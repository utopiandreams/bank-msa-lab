spring:
  application:
    name: transfer
  jpa:
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만
    open-in-view: false
  flyway:
    # 기록 테이블(flyway_schema_history) 위치를 고정한다. 안 정하면 Flyway가 "접속의 현재 스키마"를 쓰는데,
    # search_path가 "$user", public이라 계정 이름과 같은 transfer 스키마가 생기는 순간(V1) 현재 스키마가 바뀐다
    # → 두 번째 기동부터 "기록 없는 비어 있지 않은 스키마"로 보고 기동 거부 (2026-11-14 CrashLoopBackOff, FlywayRestartTest)
    default-schema: public
  # 접속 정보(spring.datasource.*)는 여기 쓰지 않는다
  #   클러스터: CloudNativePG Secret → 환경변수 (deploy/apps/transfer/values.yaml)
  #   테스트:   Testcontainers @ServiceConnection (TestcontainersConfiguration)
  # Kafka (ADR-0003). 발행 어댑터: infrastructure/kafka/KafkaTransferEventPublisher
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:bank-kafka-kafka-bootstrap:9092}   # Strimzi가 만든 클러스터 내부 Service
    producer:
      acks: all            # ISR 전부가 받아야 성공 (돈 이벤트. 지금은 브로커 1대라 사실상 리더 1대)
      properties:
        "[enable.idempotence]": true      # 프로듀서 재시도로 생기는 중복을 브로커가 걸러 준다 (acks=all과 짝)
        # 외부 호출 타임아웃 (CLAUDE.md 7장). 기본값이 송금 API에 비해 너무 길다
        "[max.block.ms]": 1000            # 브로커에 못 붙을 때 send()가 막히는 최대 시간 (기본 60초 → 송금 API가 60초 멈춤, pitfalls 20)
        "[request.timeout.ms]": 3000      # 브로커 응답 대기
        "[delivery.timeout.ms]": 5000     # 재시도 포함 전체 상한 (linger.ms + request.timeout.ms 이상이어야 한다)
  lifecycle:
    timeout-per-shutdown-phase: 30s   # preStop 5초 + 30초 < terminationGracePeriodSeconds 45초 (deploy/helm/spring-service)

# core 호출 (infrastructure/core/CoreClientProperties)
core:
  base-url: http://core     # 클러스터 내부 DNS: 같은 네임스페이스의 Service "core"(포트 80). 로컬은 환경변수 CORE_BASE_URL로 덮어쓴다
  connect-timeout: 1s       # 클러스터 내부라 연결은 ms 단위. 1초 넘으면 core가 없거나 네트워크 문제
  read-timeout: 3s          # 임시값 (T-1 질문 5번). core 송금은 로컬 트랜잭션 하나라 평소 수십 ms. 10주 차 p99 지표로 근거 있게 조정

# 외부 결제망 호출 (infrastructure/bankmock, ADR-0004). 지금은 bank-mock이 대표한다
bank-mock:
  base-url: http://bank-mock   # 클러스터 내부 Service. 로컬은 환경변수 BANK_MOCK_BASE_URL
  connect-timeout: 1s
  read-timeout: 3s             # 임시값. 넘으면 외부가 처리했는지 모름 → 보상하지 않고 INTERBANK_REQUESTED에 남는다. 15주 차 지연 실험에서 조정

# 쿠버네티스(프로브)·Prometheus(지표)가 기대는 설정. 기본값과 같은 것도 버전업으로 바뀌지 않게 명시한다
management:
  # actuator는 별도 포트로 분리한다. 같은 포트(8080)면 gateway Ingress를 통해 /actuator/prometheus가 인터넷에 열린다
  # (지표에는 경로·에러율·버전·내부 구조가 다 보인다). 8081은 Service·Ingress에 없고 Prometheus만 파드로 직접 긁는다.
  # 포트 값은 공통 차트가 MANAGEMENT_SERVER_PORT로 덮어쓴다 (deploy/helm/spring-service, 차트가 기준)
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
        # 프로브는 관리 포트가 아니라 앱 포트(8080)의 /livez·/readyz로 받는다. 관리 포트로 받으면
        # 앱 포트(Tomcat·Netty)가 고장 나 요청을 못 받는데도 Ready로 보여 트래픽이 계속 들어온다
        add-additional-paths: true
  metrics:
    tags:
      application: ${spring.application.name}   # 모든 지표에 서비스 이름 라벨 (JVM 대시보드가 이 라벨로 고른다)
    distribution:
      # API 지연 히스토그램(버킷)을 내보낸다. 이게 있어야 Prometheus에서 p99를 계산할 수 있다 (histogram_quantile).
      # 앱 안에서 백분위를 미리 계산하는 방식(percentiles)은 파드 여러 개를 합칠 수 없어서 쓰지 않는다
      percentiles-histogram:
        http.server.requests: true

server:
  shutdown: graceful
  tomcat:
    # Tomcat 스레드 지표(tomcat.threads.busy·current·config.max)를 내보내려면 MBean 등록이 필요하다 (Boot 기본값 꺼짐).
    # 부하를 올릴 때 "바쁜 스레드가 최대치에 붙었나" = 요청이 앱에 들어오기 전에 줄 서기 시작했나를 보는 숫자
    mbeanregistry:
      enabled: true
    threads:
      max: 200   # 기본값과 같지만 명시 (pitfalls 13 보이지 않는 기본값). 이 선에 붙으면 대기열이 생긴다
