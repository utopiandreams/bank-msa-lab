spring:
  application:
    name: transfer
  jpa:
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만
    open-in-view: false
  flyway:
    # 기록 테이블(flyway_schema_history) 위치를 고정한다. 안 정하면 Flyway가 "접속의 현재 스키마"를 쓰는데,
    # search_path가 "$user", public이라 계정 이름과 같은 transfer 스키마가 생기는 순간(V1) 현재 스키마가 바뀐다
    # → 두 번째 기동부터 "기록 없는 비어 있지 않은 스키마"로 보고 기동 거부 (2026-11-14 CrashLoopBackOff, FlywayRestartTest)
    default-schema: public
  # 접속 정보(spring.datasource.*)는 여기 쓰지 않는다
  #   클러스터: CloudNativePG Secret → 환경변수 (deploy/apps/transfer/values.yaml)
  #   테스트:   Testcontainers @ServiceConnection (TestcontainersConfiguration)
  lifecycle:
    timeout-per-shutdown-phase: 30s   # preStop 5초 + 30초 < terminationGracePeriodSeconds 45초 (deploy/helm/spring-service)

# core 호출 (infrastructure/core/CoreClientProperties)
core:
  base-url: http://core     # 클러스터 내부 DNS: 같은 네임스페이스의 Service "core"(포트 80). 로컬은 환경변수 CORE_BASE_URL로 덮어쓴다
  connect-timeout: 1s       # 클러스터 내부라 연결은 ms 단위. 1초 넘으면 core가 없거나 네트워크 문제
  read-timeout: 3s          # 임시값 (T-1 질문 5번). core 송금은 로컬 트랜잭션 하나라 평소 수십 ms. 10주 차 p99 지표로 근거 있게 조정

# 쿠버네티스가 기대는 설정. 기본값과 같지만 버전업으로 바뀌지 않게 명시한다
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
