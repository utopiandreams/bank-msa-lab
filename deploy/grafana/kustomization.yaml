# Grafana 대시보드를 코드로 관리한다 (CLAUDE.md 9장). JSON 파일 하나 = ConfigMap 하나.
# Grafana 사이드카가 라벨 grafana_dashboard=1인 ConfigMap을 찾아 자동으로 올린다 (kube-prometheus-stack 기본값).
#
# 대시보드 추가: Grafana에서 만들거나 고친 뒤 Share → Export → JSON 저장 → dashboards/에 넣고 아래에 한 줄 추가.
# 데이터소스는 이름 대신 변수 ${DS_PROMETHEUS}(datasource 타입)로 가리킨다 → 사이드카가 __inputs를 채워 주지 않기 때문.
#
# 출처 (버전 고정):
#   strimzi-kafka / strimzi-kraft      Strimzi 1.3.1 examples/metrics/strimzi-metrics-reporter/grafana-dashboards
#   strimzi-kafka-exporter             Strimzi 1.3.1 examples/metrics/grafana-dashboards (컨슈머 랙)
#   cnpg-cluster                       cloudnative-pg/grafana-dashboards 태그 cluster-v0.0.5 (${DS_EXPRESSION} → __expr__)
#   jvm-micrometer                     grafana.com 4701 "JVM (Micrometer)" rev 10 (__inputs → datasource 변수)
#   bank-red                           직접 작성 (2026-11-25, 10주 차 서비스 RED). 생성 스크립트 없이 JSON이 기준
#   bank-ops                           직접 작성 (2026-11-26, 은행 운영: 송금 결과·표류·외부 은행·대사)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true   # 이름 뒤 해시를 붙이지 않는다 (대시보드는 내용이 바뀌어도 이름이 같아야 사이드카가 갱신으로 본다)
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: dashboard-strimzi-kafka
    files: [dashboards/strimzi-kafka.json]
  - name: dashboard-strimzi-kraft
    files: [dashboards/strimzi-kraft.json]
  - name: dashboard-strimzi-kafka-exporter
    files: [dashboards/strimzi-kafka-exporter.json]
  - name: dashboard-cnpg-cluster
    files: [dashboards/cnpg-cluster.json]
  - name: dashboard-jvm-micrometer
    files: [dashboards/jvm-micrometer.json]
  - name: dashboard-bank-red
    files: [dashboards/bank-red.json]
  - name: dashboard-bank-ops
    files: [dashboards/bank-ops.json]
