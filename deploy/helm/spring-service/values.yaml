# 공통 기본값. 서비스별 values(deploy/apps/<서비스>/values.yaml)가 이 위에 덮어쓴다.

# 서비스 이름. 리소스 이름·라벨·호스트명에 쓰인다 (필수)
name: ""

replicaCount: 1

image:
  repository: ""        # 예: ghcr.io/utopiandreams/core (필수)
  tag: ""               # 커밋 해시. CI가 서비스별 values에서 갱신한다. latest 금지 (필수)
  pullPolicy: IfNotPresent

containerPort: 8080

# 컨테이너 환경변수 (이름: 값)
env: {}

# Secret에서 꺼내는 환경변수 (이름: {secret: <Secret 이름>, key: <키>}). 비밀번호는 values에 직접 쓰지 않는다
secretEnv: {}

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    # 메모리 limit만 건다. 넘으면 OOMKilled. 힙은 이미지의 MaxRAMPercentage=75로 이 값의 75%.
    memory: 512Mi
    # CPU limit은 일부러 걸지 않는다. JVM은 기동할 때 CPU를 몰아 쓰는데, limit이 있으면
    # 스로틀링으로 기동이 몇 배 느려지고 startupProbe에 걸려 재시작 루프에 빠지기 쉽다.

probes:
  # 기동이 끝날 때까지는 liveness를 미룬다. 최대 2초 × 60 = 120초 기다림
  startup:
    periodSeconds: 2
    failureThreshold: 60
  liveness:
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    failureThreshold: 3

# 종료 순서: preStop 대기 → SIGTERM → Spring graceful shutdown → 그래도 안 끝나면 SIGKILL
shutdown:
  # SIGTERM 전에 잠깐 기다린다. 파드가 종료 중이라는 소식이 Service 엔드포인트·Ingress(Traefik)에
  # 퍼지기 전에 앱이 먼저 내려가면, 그 사이 들어온 요청이 502가 된다.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 45

service:
  port: 80

ingress:
  enabled: false
  className: traefik
  host: ""              # 비우면 <name>.172.30.1.240.nip.io
