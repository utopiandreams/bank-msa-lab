apiVersion: v1
kind: Service
metadata:
  name: {{ include "spring-service.name" . }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP   # 클러스터 안의 대표 주소. 다른 서비스는 http://<name>.<namespace> 로 부른다
  selector:
    {{- include "spring-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
