apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spring-service.name" . }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- if eq .Values.strategy "Recreate" }}
    type: Recreate        # 옛 파드를 다 내린 뒤 새로 띄운다 (한 번에 하나만 돌아야 하는 배치용, 잠깐 멈춤을 감수)
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # 새 파드를 먼저 하나 띄우고
      maxUnavailable: 0   # 새 파드가 Ready가 되기 전에는 기존 파드를 내리지 않는다 → replicas 1이어도 무중단
    {{- end }}
  selector:
    matchLabels:
      {{- include "spring-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spring-service.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.tracing.enabled }}
      # 에이전트 jar만 공유 볼륨으로 복사하고 끝난다 (values.yaml tracing 주석)
      initContainers:
        - name: otel-agent
          image: {{ .Values.tracing.agentImage | quote }}
          command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
      {{- end }}
      containers:
        - name: app
          image: "{{ required "image.repository가 필요합니다" .Values.image.repository }}:{{ required "image.tag가 필요합니다" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
            # actuator 전용 포트. Service에는 넣지 않는다 → Ingress로 나갈 길이 없고, Prometheus만 PodMonitor로 파드를 직접 긁는다
            - name: management
              containerPort: {{ .Values.managementPort }}
          env:
            # 앱의 management.server.port를 차트 값으로 고정한다 (포트 번호의 기준은 차트 하나)
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.managementPort | quote }}
            {{- if .Values.tracing.enabled }}
            - name: JDK_JAVA_OPTIONS
              value: "-javaagent:/otel/javaagent.jar"
            - name: OTEL_SERVICE_NAME            # 트레이스 화면에서 구간마다 붙는 서비스 이름
              value: {{ include "spring-service.name" . | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.tracing.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.tracing.sampler | quote }}
            - name: OTEL_METRICS_EXPORTER        # 지표는 Micrometer → Prometheus가 이미 한다 (중복 방지)
              value: none
            - name: OTEL_LOGS_EXPORTER           # 로그는 stdout → 노드의 Alloy가 파일을 읽어 Loki로 (deploy/argocd/apps/alloy.yaml). 에이전트는 MDC에 trace_id만 넣는다
              value: none
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: OTEL_RESOURCE_ATTRIBUTES     # 어느 파드·어느 버전(이미지 태그)이 처리했나
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name={{ .Release.Namespace }},service.version={{ .Values.image.tag }}"
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.secretEnv }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $v.secret }}
                  key: {{ $v.key }}
            {{- end }}
          # startup: 기동 완료 전까지 liveness·readiness를 보류 (느린 기동을 죽음으로 오해하지 않게)
          # 프로브는 앱 포트(http)의 /livez·/readyz (management.endpoint.health.probes.add-additional-paths).
          # 관리 포트로 받으면 앱 포트가 고장 나도 Ready로 보인다 → 요청을 못 받는 파드에 트래픽이 계속 간다
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          # liveness: 실패하면 컨테이너를 재시작한다 → "재시작하면 낫는 상태"만 판단해야 한다
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # readiness: 실패하면 Service에서 빠진다 (재시작은 안 함) → 트래픽을 받을 준비가 됐는가
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.shutdown.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # 컨테이너 안에 파일을 못 쓴다. 쓸 곳은 아래 /tmp만
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp   # 내장 Tomcat이 임시 파일을 여기에 쓴다
            {{- if .Values.tracing.enabled }}
            - name: otel-agent
              mountPath: /otel
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.tracing.enabled }}
        - name: otel-agent
          emptyDir: { sizeLimit: 64Mi }
        {{- end }}
