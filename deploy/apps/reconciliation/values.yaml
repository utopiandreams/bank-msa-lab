# reconciliation(일일 대사) 서비스 배포 설정 (ADR-0006). 공통 차트(deploy/helm/spring-service)의 기본값 위에 덮어쓴다.
name: reconciliation

image:
  repository: ghcr.io/utopiandreams/reconciliation
  # CI(.github/workflows/services.yaml)가 빌드할 때마다 커밋 해시로 고쳐서 커밋한다. 손으로 고치지 않는다.
  # 첫 push 전에는 이미지가 없어 잠깐 ImagePullBackOff → CI가 태그를 커밋하면 풀린다
  tag: "f4d2ec783ee65325c0d210468380c99a68809d64"

# 롤링(새 파드 먼저)이 아니라 옛 파드를 내린 뒤 띄운다: 배포 중 잠깐 파드 2개가 같은 날짜 대사를 잡지 않게 (ADR-0006 결정 16).
# 대사는 몇 초 멈춰도 되는 배치
strategy: Recreate

# DB 접속: CloudNativePG가 만든 Secret reconciliation-db-app (deploy/platform/reconciliation-db)
# Kafka 접속은 application.yaml 기본값(bank-kafka-kafka-bootstrap:9092)
# 추출 파일 저장소: Garage (deploy/platform/garage, Secret garage-secrets)
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://reconciliation-db-rw:5432/reconciliation
  STORAGE_ENDPOINT: http://garage:3900
  STORAGE_REGION: garage
  STORAGE_BUCKET: daily-extracts
secretEnv:
  SPRING_DATASOURCE_USERNAME: { secret: reconciliation-db-app, key: username }
  SPRING_DATASOURCE_PASSWORD: { secret: reconciliation-db-app, key: password }
  STORAGE_ACCESS_KEY_ID: { secret: garage-secrets, key: access-key-id }
  STORAGE_SECRET_ACCESS_KEY: { secret: garage-secrets, key: secret-access-key }

# 외부에 열지 않는다 (HTTP API 없음. actuator는 프로브용)
ingress:
  enabled: false
