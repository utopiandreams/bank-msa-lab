# notification 서비스 배포 설정. 공통 차트(deploy/helm/spring-service)의 기본값 위에 덮어쓴다.
name: notification

image:
  repository: ghcr.io/utopiandreams/notification
  # CI(.github/workflows/services.yaml)가 빌드할 때마다 커밋 해시로 고쳐서 커밋한다. 손으로 고치지 않는다.
  tag: "048501b8ce82e373440f08eb66e4de26a635f8ce"

# DB 접속: CloudNativePG가 만든 Secret notification-db-app (deploy/platform/notification-db)
# Kafka 접속은 application.yaml 기본값(bank-kafka-kafka-bootstrap:9092)
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db-rw:5432/notification
secretEnv:
  SPRING_DATASOURCE_USERNAME: { secret: notification-db-app, key: username }
  SPRING_DATASOURCE_PASSWORD: { secret: notification-db-app, key: password }

# 외부에 열지 않는다 (HTTP API 없음, Kafka로만 일한다. actuator는 프로브용)
ingress:
  enabled: false
