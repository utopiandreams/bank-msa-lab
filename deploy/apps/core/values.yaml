# core 서비스 배포 설정. 공통 차트(deploy/helm/spring-service)의 기본값 위에 덮어쓴다.
name: core

image:
  repository: ghcr.io/utopiandreams/core
  # CI(.github/workflows/services.yaml)가 빌드할 때마다 커밋 해시로 고쳐서 커밋한다. 손으로 고치지 않는다.
  tag: "04113f9c5d5d39da40753e7652ebe24cc0e528ec"

# DB 접속: CloudNativePG가 만든 Secret core-db-app에서 꺼낸다 (deploy/platform/core-db)
# Spring은 SPRING_DATASOURCE_URL 같은 환경변수를 spring.datasource.url로 읽는다 (relaxed binding)
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://core-db-rw:5432/core
secretEnv:
  SPRING_DATASOURCE_USERNAME: { secret: core-db-app, key: username }
  SPRING_DATASOURCE_PASSWORD: { secret: core-db-app, key: password }

# 외부에 열지 않는다: 클러스터 밖 요청은 gateway만 받는다 (ADR-0002 결정 4, G-3)
# 직접 확인이 필요하면: kubectl -n bank port-forward svc/core 8080:80
ingress:
  enabled: false
