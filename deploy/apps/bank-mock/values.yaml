# bank-mock 배포 설정: 외부 결제망(금융결제원 + 타행) 흉내 (ADR-0004). 공통 차트 기본값 위에 덮어쓴다.
name: bank-mock

image:
  repository: ghcr.io/utopiandreams/bank-mock
  # CI(.github/workflows/services.yaml)가 빌드할 때마다 커밋 해시로 고쳐서 커밋한다. 손으로 고치지 않는다.
  # 첫 배포는 CI가 이 줄을 고칠 때까지 이미지가 없어 ImagePullBackOff → 태그 커밋 뒤 자동 회복
  tag: "e0ce599c1a839f1b3ce69a3fa49ff8819687ff2d"

# 외부 은행의 행동 = 실험 스위치 (BankMockProperties). 여기 값을 바꿔 push하면 Argo CD가 반영한다
env:
  BANK_MOCK_REJECT_RATE_PERCENT: "0"

# 외부에 열지 않는다: transfer만 클러스터 안에서 부른다 (http://bank-mock)
ingress:
  enabled: false
