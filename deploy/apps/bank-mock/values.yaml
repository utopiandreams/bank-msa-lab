# bank-mock 배포 설정: 외부 결제망(금융결제원 + 타행) 흉내 (ADR-0004). 공통 차트 기본값 위에 덮어쓴다.
name: bank-mock

image:
  repository: ghcr.io/utopiandreams/bank-mock
  # CI(.github/workflows/services.yaml)가 빌드할 때마다 커밋 해시로 고쳐서 커밋한다. 손으로 고치지 않는다.
  # 첫 배포는 CI가 이 줄을 고칠 때까지 이미지가 없어 ImagePullBackOff → 태그 커밋 뒤 자동 회복
  tag: "b874bf1979fc5aa2a0272f11891065fd6012876c"

# 외부 은행의 행동 = 실험 스위치의 **시작값** (BankMockProperties). 실행 중 변경은 재시작 없이 관리 포트로 (2026-11-26):
#   kubectl -n bank port-forward deploy/bank-mock 18082:8081
#   curl -X POST localhost:18082/actuator/experiments -H 'Content-Type: application/json' -d '{"responseDelay":"5s","responseDelayPercent":2}'
# DB 접속: CloudNativePG가 만든 Secret bank-mock-db-app (deploy/platform/bank-mock-db)
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://bank-mock-db-rw:5432/bankmock
  # "평소 외부 은행" (2026-11-26 운영 모드): 실제 외부 기관처럼 가끔 거절하고, 가끔 늦는다 → 평소에도 결과 불명이 조금씩 생기고 해소 일꾼이 푼다
  BANK_MOCK_REJECT_RATE_PERCENT: "1"          # 받는 은행이 그냥 거절 1% → 보상(CANCELLED)
  BANK_MOCK_RESPONSE_DELAY: "5s"              # 처리·기록은 했는데 응답이 transfer read-timeout(3s)보다 늦음
  BANK_MOCK_RESPONSE_DELAY_PERCENT: "2"       #   → 2%가 결과 불명 → 조회하면 "있음" → COMPLETED (또는 거절이면 CANCELLED)
  BANK_MOCK_PROCESSING_DELAY: "12s"           # 처리 상한(10s)을 넘김 → 처리 안 함(503)
  BANK_MOCK_PROCESSING_DELAY_PERCENT: "1"     #   → 1%가 결과 불명 → 조회하면 "없음" → 출금 취소(CANCELLED, 사유 없음)
  # 실험 스위치 예 (2026-11-25 이중 지급 재현에 썼다, docs/experiments/week-08-reconciliation.md):
  # BANK_MOCK_RESPONSE_DELAY: "5s"            # transfer read-timeout(3s)보다 길게 → 결과 불명
  # BANK_MOCK_LOOKUP_LIES_NOT_FOUND: "true"   # 조회 계약 위반 → 해소 일꾼이 출금 취소 → 이중 지급

secretEnv:
  SPRING_DATASOURCE_USERNAME: { secret: bank-mock-db-app, key: username }
  SPRING_DATASOURCE_PASSWORD: { secret: bank-mock-db-app, key: password }

# 외부에 열지 않는다: transfer만 클러스터 안에서 부른다 (http://bank-mock)
ingress:
  enabled: false
