# transfer 서비스 배포 설정. 공통 차트(deploy/helm/spring-service)의 기본값 위에 덮어쓴다.
name: transfer

image:
  repository: ghcr.io/utopiandreams/transfer
  # CI(.github/workflows/services.yaml)가 빌드할 때마다 커밋 해시로 고쳐서 커밋한다. 손으로 고치지 않는다.
  tag: "3b08b617ab4f1399147af4254cd66c5c4528040a"

# DB 접속: CloudNativePG가 만든 Secret transfer-db-app에서 꺼낸다 (deploy/platform/transfer-db)
env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://transfer-db-rw:5432/transfer
secretEnv:
  SPRING_DATASOURCE_USERNAME: { secret: transfer-db-app, key: username }
  SPRING_DATASOURCE_PASSWORD: { secret: transfer-db-app, key: password }

# 확인용으로 외부에 연다 → http://transfer.172.30.1.240.nip.io (gateway가 생기면 닫는다)
ingress:
  enabled: true
