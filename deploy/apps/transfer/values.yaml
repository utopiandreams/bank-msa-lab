# transfer 서비스 배포 설정. 공통 차트(deploy/helm/spring-service)의 기본값 위에 덮어쓴다.
name: transfer

image:
  repository: ghcr.io/utopiandreams/transfer
  # CI(.github/workflows/services.yaml)가 빌드할 때마다 커밋 해시로 고쳐서 커밋한다. 손으로 고치지 않는다.
  tag: "cab5aba88cc915e408e8f4d0731a0223dd9e2fc3"

# DB 접속: CloudNativePG가 만든 Secret transfer-db-app에서 꺼낸다 (deploy/platform/transfer-db)
env:
  # 대사 추출 파일 저장소 (Garage, ADR-0006)
  STORAGE_ENDPOINT: http://garage:3900
  STORAGE_REGION: garage
  STORAGE_BUCKET: daily-extracts
  SPRING_DATASOURCE_URL: jdbc:postgresql://transfer-db-rw:5432/transfer
secretEnv:
  SPRING_DATASOURCE_USERNAME: { secret: transfer-db-app, key: username }
  SPRING_DATASOURCE_PASSWORD: { secret: transfer-db-app, key: password }
  STORAGE_ACCESS_KEY_ID: { secret: garage-secrets, key: access-key-id }
  STORAGE_SECRET_ACCESS_KEY: { secret: garage-secrets, key: secret-access-key }

# 2026-11-26: 공통 640Mi → 1Gi (transfer만). 평소에도 컨테이너 메모리가 597Mi(한도의 93%)에 붙어 부하 없이도 요청이 2~12초 걸렸고
# (한도 근처에서 커널이 실행 코드·jar 페이지 캐시를 쫓아냄 → 다시 읽느라 멈춤으로 추정), 150건/초에서 스레드가 200개로 늘자 OOMKilled.
# 근본 원인(커넥션 풀 한계 초당 약 65건, 힙 밖·지표에 안 잡히는 메모리 약 200Mi)은 따로 본다. 힙은 MaxRAMPercentage=75라 768Mi까지
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    memory: 1Gi

# 외부에 열지 않는다: 클러스터 밖 요청은 gateway만 받는다 (ADR-0002 결정 4, G-3)
# 직접 확인이 필요하면: kubectl -n bank port-forward svc/transfer 8080:80
ingress:
  enabled: false
