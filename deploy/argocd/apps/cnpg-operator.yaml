# CloudNativePG 오퍼레이터 (Postgres 운영을 자동화하는 컨트롤러, CRD 포함). 공식 Helm 차트를 그대로 설치한다.
# 이 오퍼레이터가 Cluster 리소스(deploy/platform/<서비스>-db)를 보고 Postgres 파드·PVC·접속 Service·계정 Secret을 만든다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1   # 오퍼레이터 1.30.1
    helm:
      valuesObject:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CNPG의 CRD는 매우 커서 기본(client-side) apply로는 annotation 크기 제한(256KB)에 걸린다
      - ServerSideApply=true
