# Garage (S3 호환 오브젝트 저장소, 8주 차 대사 추출 파일). 차트 없이 매니페스트 (deploy/platform/garage)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # 서비스(wave 2) 앞
spec:
  project: default
  source:
    repoURL: https://github.com/utopiandreams/bank-msa-lab.git
    targetRevision: main
    path: deploy/platform/garage
  destination:
    server: https://kubernetes.default.svc
    namespace: bank
  syncPolicy:
    automated:
      prune: false     # 파일은 대사의 증거. Git에서 실수로 지워도 저장소가 사라지지 않게 (PVC는 원래 Argo가 지우지 않는다)
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
