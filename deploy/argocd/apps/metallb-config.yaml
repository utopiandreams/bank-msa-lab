# MetalLB 설정 (IP 풀, L2 광고). MetalLB 본체의 CRD가 먼저 있어야 적용된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # metallb 다음
spec:
  project: default
  source:
    repoURL: https://github.com/utopiandreams/bank-msa-lab.git
    targetRevision: main
    path: deploy/platform/metallb-config
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRD가 아직 없을 때 사전 검사(dry-run)에서 실패하지 않게 한다
      - SkipDryRunOnMissingResource=true
    # sync-wave만으로는 "MetalLB가 준비될 때까지" 기다려 주지 않는다 (아래 노트 참고).
    # 그래서 웹훅이 뜰 때까지 실패하면 재시도한다.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
