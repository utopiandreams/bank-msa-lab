# Loki (2026-11-25, 10주 차): 로그 저장소. 노드마다 Alloy가 파드 로그 파일(/var/log/pods)을 읽어 여기로 보낸다 → Grafana에서 조회.
# AWS로 치면 CloudWatch Logs. 구성·결정은 docs/infra/README.md "로그 (Loki)", 개념은 docs/learning/observability.md 5-0.
#
# Loki는 로그 내용을 색인하지 않는다 (Elasticsearch와 가장 큰 차이). 라벨(namespace·app·pod·container)로 범위를 좁힌 뒤
# 그 안을 grep처럼 훑는다 → 저장·메모리가 싸다. 대신 라벨에 송금 ID·trace ID 같은 값을 넣으면 안 된다 (카디널리티 폭발).
# trace ID는 라벨이 아니라 "구조화 메타데이터"(줄마다 붙는 색인 안 하는 필드)로 둔다 (deploy/argocd/apps/alloy.yaml)
#
# 차트 저장소가 grafana → grafana-community로 옮겨졌다 (Tempo와 같음). 모드는 Monolithic(단일 바이너리) + 파일시스템 저장.
# 운영형(SimpleScalable·Distributed)은 S3가 필요하고 학습 범위 밖
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # Alloy가 보낼 곳이라 먼저
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 21.6.0   # Loki 3.7.10
    helm:
      releaseName: loki
      valuesObject:
        fullnameOverride: loki   # Service loki.monitoring:3100 (Alloy·Grafana가 이 이름으로 찾는다)
        deploymentMode: Monolithic
        loki:
          auth_enabled: false   # 테넌트 구분 안 함 (켜면 모든 요청에 X-Scope-OrgID 헤더가 필요)
          commonConfig:
            replication_factor: 1   # 한 대뿐
          storage:
            type: filesystem        # PVC 안에 청크·색인 (S3 대신)
          schemaConfig:
            configs:
              - from: "2026-11-01"   # 이 날짜부터 이 형식으로 쓴다. 형식을 바꿀 땐 줄을 지우지 말고 새 날짜로 추가 (옛 데이터를 읽어야 해서)
                store: tsdb
                object_store: filesystem
                schema: v13          # 구조화 메타데이터를 쓰려면 v13
                index: { prefix: index_, period: 24h }
          limits_config:
            retention_period: 72h          # Tempo와 같게. 실험 장면은 몇 시간 안에 보고 끝난다
            allow_structured_metadata: true # trace_id를 줄마다 붙이려고 (v13 기본값이지만 명시)
            volume_enabled: true
          compactor:
            retention_enabled: true        # 이게 있어야 retention_period가 실제로 지운다 (없으면 디스크가 계속 찬다)
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            storageClass: local-path
            size: 10Gi
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }   # 넓은 범위 조회 때 튄다. 실측 후 조정
        # Monolithic이라 나머지 구성 요소는 0
        read: { replicas: 0 }
        write: { replicas: 0 }
        backend: { replicas: 0 }
        # 기본값으로 켜져 있는 부속을 끈다 (메모리가 클러스터의 병목):
        gateway: { enabled: false }       # nginx 앞단. 한 대라 필요 없음, Grafana·Alloy가 loki:3100으로 직접
        chunksCache: { enabled: false }   # memcached (기본 요청 메모리가 GB 단위)
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }    # 노드마다 로그를 써 보고 읽어 보는 감시 파드
        test: { enabled: false }          # helm test용 (Argo CD는 안 돌린다)
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
