# GitOps 동작 확인용 테스트 앱
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
  # 2026-11-19 제거 준비: 이 표시가 있어야 Application을 지울 때 만든 리소스(파드·서비스·Ingress)도 같이 지운다.
  # 없으면 Application만 사라지고 리소스는 주인 없이 남는다 (다음 커밋에서 이 파일을 지운다)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/utopiandreams/bank-msa-lab.git
    targetRevision: main
    path: deploy/apps/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
