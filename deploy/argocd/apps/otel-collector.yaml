# OpenTelemetry Collector (9주 차, 2026-11-23): 서비스들의 에이전트가 보낸 구간(span)을 받아 모아서 Tempo로 넘기는 집하장.
# AWS로 치면 ADOT Collector. 앱은 Collector 주소만 알고 저장소(Tempo·X-Ray·Datadog)는 모른다 → 저장소를 바꿔도 앱은 그대로.
#
# 지금 하는 일은 최소: OTLP로 받기 → 메모리 상한 → 묶어 보내기 → Tempo.
# 샘플링(꼬리 기반), 민감 정보 지우기, 로그(10주 차)는 필요해지면 processors에 더한다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.178.2   # Collector 0.163.2 (2026-11-02, 2주 넘게 검증된 버전)
    helm:
      releaseName: otel-collector
      # values(문자열)로 쓴다: valuesObject로 쓰면 Argo CD가 null 값을 버려서, 기본값을 지우려던 null(debug 출력,
      # metrics·logs 파이프라인, prometheus 수신기)이 무시되고 기본값이 그대로 남았다 (2026-11-23, pitfalls 38)
      values: |
          fullnameOverride: otel-collector   # Service 이름 otel-collector.monitoring (서비스 차트의 tracing.endpoint)
          mode: deployment                   # 노드마다(DaemonSet)가 아니라 하나. 앱이 Service 주소로 보낸다
          image:
            repository: otel/opentelemetry-collector-k8s   # 쿠버네티스용 배포판 (필요한 구성 요소만 든 작은 이미지)
          # 기본값이 여는 Jaeger·Zipkin 포트는 쓰지 않는다 (받는 길은 OTLP 하나)
          ports:
            jaeger-compact: { enabled: false }
            jaeger-thrift: { enabled: false }
            jaeger-grpc: { enabled: false }
            zipkin: { enabled: false }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }   # memory_limiter가 이 값의 80%에서 받기를 멈춰 OOMKilled 대신 거절한다
          config:
            receivers:
              jaeger: null
              zipkin: null
              prometheus: null
            processors:
              # 잡음 버리기 (2026-11-23): 쿠버네티스 프로브(/livez·/readyz, 몇 초마다)와 Prometheus 수집(/actuator/**, 15초마다)도
              # 서버 구간으로 잡혀 트레이스 검색을 가린다. 앱 쪽 에이전트에는 경로 제외 설정이 없어서 Collector에서 버린다
              filter/noise:
                error_mode: ignore
                traces:
                  span:
                    - 'IsMatch(attributes["url.path"], "^/(livez|readyz|actuator)(/.*)?$")'
                    # Hikari 커넥션 풀의 관리 스레드(housekeeper)가 주기적으로 커넥션을 확인하는 빈 쿼리 (2026-11-24 발견).
                    # 요청과 무관하게 구간 하나짜리 트레이스(이름 = DB 이름)로 쌓인다
                    - 'IsMatch(attributes["thread.name"], ":housekeeper$")'
              # 트레이스 통째로 고르기 (2026-11-24): 위 filter는 구간 하나씩만 보지만, tail_sampling은 한 트레이스의 구간을
              # decision_wait 동안 모았다가 트레이스 단위로 남길지 정한다 (= 꼬리 기반 샘플링. 운영에선 "에러·느린 것은 꼭 남기기"에 쓴다)
              # 지금 쓰는 정책은 하나: Outbox 릴레이 회차(1초마다, 대부분 0건)를 통째로 버린다.
              # 발행 구간은 회차가 아니라 원래 요청 트레이스에 붙으므로(pitfalls 39) 회차 트레이스에는 SELECT·UPDATE만 남아 볼 게 없다.
              # 구간 단위 filter로 회차 구간만 지우면 자식 SELECT가 부모 잃은 트레이스로 남아서 tail_sampling을 쓴다.
              # 전제: 한 트레이스의 구간이 모두 같은 Collector로 와야 한다 (지금 1대. 여러 대면 앞에 trace ID 기준 load-balancing exporter)
              tail_sampling:
                decision_wait: 10s   # 요청 트레이스는 Outbox 대기(~1초)까지 끝나야 다 모인다. 늦게 온 구간은 따로 판정돼 남는다
                policies:
                  - name: drop-outbox-relay-rounds
                    type: drop          # drop은 다른 정책보다 우선한다
                    drop:
                      drop_sub_policy:
                        - name: relay-round
                          type: ottl_condition
                          ottl_condition:
                            error_mode: ignore
                            span:
                              - 'name == "OutboxRelay.relay"'
                  - name: keep-everything-else
                    type: always_sample   # 학습 환경이라 나머지는 전부 남긴다
            exporters:
              debug: null
              otlp/tempo:
                endpoint: tempo.monitoring:4317
                tls: { insecure: true }   # 클러스터 안 통신 (학습 타협, mTLS는 범위 밖)
            service:
              pipelines:
                traces:
                  receivers: [otlp]
                  processors: [memory_limiter, filter/noise, tail_sampling, batch]   # 메모리 상한 → 잡음 구간 → 잡음 트레이스 → 묶어 보내기
                  exporters: [otlp/tempo]
                metrics: null   # 지표는 Prometheus가 앱에서 직접 긁는다 (Micrometer)
                logs: null      # 로그는 10주 차 Loki
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
