# Kafka 클러스터 (Strimzi, KRaft 모드 = ZooKeeper 없음). 공식 예제 kafka-single-node.yaml을 바탕으로 줄였다.
# 지금은 1대가 브로커 + 컨트롤러를 겸한다 (학습 초반, 메모리 절약). 17주 차 브로커 장애 실험 전에 3대로 늘린다:
#   KafkaNodePool replicas: 3 + 아래 replication.factor·min.insync.replicas 상향 (docs/learning/kafka.md 4·9)
#
# 오퍼레이터가 만들어 주는 것:
#   - 파드 bank-kafka-dual-role-0 + PVC (local-path)
#   - Service bank-kafka-kafka-bootstrap:9092 ← 앱이 여기로 접속 (클러스터 내부 전용)
#   - Entity Operator (KafkaTopic 선언을 실제 토픽으로 만드는 컨트롤러)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: bank-kafka
spec:
  replicas: 1
  roles:
    - controller   # 메타데이터 합의(KRaft, Raft 변형) 참여 — docs/learning/consensus.md
    - broker       # 실제 메시지 저장·전달
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1536Mi   # CPU limit은 걸지 않는다 (JVM, pitfalls 16)
  jvmOptions:
    -Xms: 768m
    -Xmx: 768m          # 힙은 limit의 절반 정도: Kafka는 OS 페이지 캐시로 로그를 읽어서 힙 밖 메모리가 중요하다
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: false      # Kafka를 지워도 데이터 디스크는 남긴다
        kraftMetadata: shared   # KRaft 메타데이터 로그도 같은 디스크에
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: bank-kafka
spec:
  kafka:
    version: 4.3.2
    metadataVersion: 4.3-IV0
    listeners:
      # 클러스터 내부 전용, 평문. 외부 노출·TLS·인증(SCRAM/mTLS)은 필요해지면 (지금은 bank 네임스페이스 안의 서비스만 쓴다)
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # 브로커 1대라 복제본을 둘 곳이 없다 → 전부 1. 3대로 늘릴 때 3 / min.insync 2로 올린다
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # 토픽은 KafkaTopic 선언으로만 만든다 (오타난 토픽 이름으로 보내면 자동 생성 대신 에러가 나야 한다, GitOps)
      auto.create.topics.enable: false
    # 브로커 지표를 Prometheus 형식으로 노출한다 (포트 tcp-prometheus 9404 → deploy/platform/monitoring의 PodMonitor가 수집).
    # JMX Exporter(정규식 규칙이 담긴 큰 ConfigMap)와 달리 Strimzi 자체 플러그인이라 설정이 한 줄이다. 공식 예제도 이쪽이 기본
    metricsConfig:
      type: strimziMetricsReporter
  # 컨슈머 그룹 랙(= 쌓였는데 아직 안 읽은 메시지 수)을 지표로 만드는 별도 파드.
  # 브로커 지표에는 랙이 없다 → 4주 차 notification, 16주 차 랙·핫 파티션 실험의 핵심 숫자
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
  entityOperator:
    topicOperator: {}   # KafkaTopic → 실제 토픽. 사용자 인증을 안 쓰니 userOperator는 두지 않는다
