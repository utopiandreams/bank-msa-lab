# transfer 서비스 전용 PostgreSQL (DB per service). CloudNativePG 오퍼레이터가 이 선언을 보고 실제 자원을 만든다.
#
# 오퍼레이터가 만들어 주는 것:
#   - 파드 transfer-db-1 + PVC (local-path)
#   - Service transfer-db-rw (쓰기, primary) / transfer-db-ro (읽기, replica) / transfer-db-r (아무 인스턴스)
#   - Secret transfer-db-app (username, password, uri, jdbc-uri …) ← transfer가 이걸로 접속
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: transfer-db
spec:
  # 지금은 1대. 17주 차 "DB 다운" 실험 때 2~3대로 늘려 페일오버를 본다
  instances: 1

  bootstrap:
    initdb:
      database: transfer   # DB 이름
      owner: transfer  # 앱 계정 (비밀번호는 오퍼레이터가 생성해 Secret transfer-db-app에 넣는다)

  storage:
    size: 2Gi          # StorageClass는 기본값(local-path). 노드에 묶인다는 한계는 docs/infra 참고

  # 2026-11-18 라이트사이징: 메모리 request = limit 512Mi (이전 256Mi / 512Mi).
  # 실측: 기준선(송금 60건/초)에서 DB 메모리 약 100Mi(request의 40%), CPU는 남아돎.
  # 그래도 512로 잡는 이유: 송금 피크에 조회·배치(8주 차 대사) 같은 다른 부하가 겹칠 수 있고,
  # DB가 OOMKilled되면 앱보다 훨씬 비싸다 (크래시 복구, 진행 중 트랜잭션 전부 실패).
  # shared_buffers 128MB + 연결마다 프로세스(연결당 수 MB) + work_mem이 이 안에 들어가야 한다
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi

  postgresql:
    parameters:
      # 메모리 limit 512Mi에 맞춘다 (기본값은 더 큰 서버 기준)
      shared_buffers: "128MB"
      max_connections: "100"
