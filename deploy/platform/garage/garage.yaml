# Garage: S3 호환 오브젝트 저장소 (8주 차 일일 대사, ADR-0006). 대사용 일자별 추출 파일을 둔다. AWS로 치면 S3.
# 구성·결정·확인 방법은 docs/infra/README.md "오브젝트 저장소 (Garage)".
#
# 차트가 아니라 매니페스트를 직접 쓰는 이유: 단일 노드면 `garage server --single-node --default-bucket` 한 줄로
#   레이아웃·키·버킷이 자동으로 만들어진다 (v2.3.0+). 공식 차트는 다중 노드용 CRD(kubernetes_discovery)와 수동 레이아웃 절차가 딸려 온다.
# StatefulSet인 이유: 데이터(PVC)가 파드에 붙어 있고, replicas 1이라 롤링 때 옛 파드를 내린 뒤 새로 띄운다 (같은 디스크를 둘이 열지 않게).
# replication_factor 1 = 복제 없음: 노드(디스크)를 잃으면 파일도 잃는다. 학습 타협. 파일은 대사의 증거라 실무라면 3복제 + 다른 장애 영역.
# 비밀값(RPC 비밀, 관리 토큰, 접근 키)은 Git에 두지 않고 Secret garage-secrets로 (docs/infra/README.md에 만드는 명령)
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  labels:
    app: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = 1

    # 노드끼리 말하는 포트. 단일 노드라 자기 자신만
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"
    # rpc_secret은 환경변수 GARAGE_RPC_SECRET (Secret)

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    # 클라이언트는 경로 방식(http://garage:3900/<버킷>/<키>)으로 부른다. 가상 호스트 방식용 도메인은 쓰지 않음
    root_domain = ".s3.garage.localhost"

    [admin]
    api_bind_addr = "[::]:3903"
    # admin_token은 환경변수 GARAGE_ADMIN_TOKEN (Secret).
    # metrics_token을 두지 않아 /metrics는 토큰 없이 열린다 (클러스터 안 전용, Prometheus가 긁게)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels:
    app: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
      # 설정(ConfigMap)이 바뀌어도 파드는 자동으로 다시 뜨지 않는다: 바꿀 일이 드물어 손으로 재시작 (kubectl -n bank rollout restart sts/garage)
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: garage
          image: dxflrs/garage:v2.6.0
          command: ["/garage", "server", "--single-node", "--default-bucket"]
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: garage-secrets, key: rpc-secret } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: garage-secrets, key: admin-token } }
            # 첫 기동 때 기본 접근 키와 버킷을 만든다 (이미 있으면 그대로). 이 키 하나를 모든 서비스가 같이 쓴다:
            # 학습 타협. 실무는 서비스마다 키를 따로 두고 추출하는 쪽은 쓰기만, 대사는 읽기만 (최소 권한)
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: garage-secrets, key: access-key-id } }
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: garage-secrets, key: secret-access-key } }
            - name: GARAGE_DEFAULT_BUCKET
              value: daily-extracts
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          volumeMounts:
            - { name: config, mountPath: /etc/garage }
            - { name: meta, mountPath: /var/lib/garage/meta }
            - { name: data, mountPath: /var/lib/garage/data }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }   # 실측 후 조정 (메모리가 클러스터의 병목)
          # /health: 쿼럼이 있으면(= 요청을 처리할 수 있으면) 200, 아니면 503. 인증 없음
          readinessProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: s3 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: garage-config }
  volumeClaimTemplates:
    # 메타데이터(LMDB: 버킷·키·객체 목록)와 데이터(실제 파일 블록)를 나눈다. 공식 권장: 메타는 빠른 디스크
    - metadata: { name: meta }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: { requests: { storage: 1Gi } }
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: { requests: { storage: 5Gi } }   # 하루치 추출 파일은 수 MB. 보관 기간 정책은 대사 구현 때
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  labels:
    app: garage
spec:
  selector:
    app: garage
  ports:
    - { name: s3, port: 3900, targetPort: s3 }        # 서비스들이 쓰는 S3 API: http://garage.bank:3900
    - { name: admin, port: 3903, targetPort: admin }  # /health, /metrics, 관리 API
