# 평소 트래픽: k6를 끝없이 반복 (한 번 = 다음 정각까지, 그 시각의 송금량으로). steady.js 주석 참고
#
# 잠깐 멈추기 (장애 실험을 깨끗한 바탕에서 하고 싶을 때):
#   kubectl -n bank scale deploy/steady-traffic --replicas=0     (다시: --replicas=1)
#   Argo CD 앱이 replicas를 무시하도록 해 두어 selfHeal이 되돌리지 않는다 (deploy/argocd/apps/steady-traffic.yaml)
# 송금량 바꾸기: 아래 RATE_SCALE (push하면 반영)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steady-traffic
  labels: { app.kubernetes.io/name: steady-traffic, app.kubernetes.io/part-of: bank-msa-lab }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: steady-traffic }
  template:
    metadata:
      labels: { app.kubernetes.io/name: steady-traffic, app.kubernetes.io/part-of: bank-msa-lab }
    spec:
      containers:
        - name: k6
          image: grafana/k6:2.3.0   # 맥북·lock-compare.sh와 같은 버전
          command: ["/bin/sh", "-c"]
          # 실패해도(스크립트 오류·계좌 파일 없음) 10초 쉬고 다시. 한 번 끝날 때마다 요약이 로그에 남는다 (= 시간별 기록)
          args: ["while true; do k6 run --quiet /scripts/steady.js || sleep 10; done"]
          env:
            - { name: RATE_SCALE, value: "1" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: script, mountPath: /scripts }
            - { name: accounts, mountPath: /accounts }
      volumes:
        - name: script
          configMap: { name: steady-traffic-script }
        - name: accounts
          configMap: { name: steady-accounts }   # seed.sh가 kubectl로 만든다 (생성 데이터라 Git 밖)
